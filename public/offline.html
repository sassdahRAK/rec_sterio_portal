<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RecSterio: offline</title>
    <style>
      :root {
        color-scheme: light;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        color: #111111;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.5;
        text-align: center;
      }
      main {
        max-width: 27rem;
        padding: 2rem 1.5rem;
      }
      .mark {
        width: 3.5rem;
        height: 0.375rem;
        border-radius: 999px;
        background: #e83e5a;
        margin: 0 auto 1.75rem;
      }
      h1 {
        font-size: 1.5rem;
        line-height: 1.25;
        margin: 0 0 0.75rem;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 1.5rem;
        color: #4b5563;
      }
      button {
        appearance: none;
        border: 1px solid #e83e5a;
        border-radius: 0.5rem;
        background: #e83e5a;
        color: #ffffff;
        font: inherit;
        font-weight: 600;
        padding: 0.625rem 1.5rem;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(0.95);
      }
      button:focus-visible {
        outline: 2px solid #111111;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark"></div>
      <h1>RecSterio needs a connection</h1>
      <p>
        The dataset lives on the server, so the portal cannot load it while you
        are offline. Check your connection, then try again.
      </p>
      <button onclick="location.reload()">Reload</button>
    </main>
  </body>
</html>
